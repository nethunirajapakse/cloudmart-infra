apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloudmart-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: user-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudmart-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloudmart-secret-store
    kind: SecretStore
  target:
    name: cloudmart-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: cloudmart/prod/db-credentials
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: cloudmart/prod/jwt-secret
